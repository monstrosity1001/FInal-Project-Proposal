name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensure the latest artifact actions are used
      - name: Setup artifact v4
        uses: actions/upload-artifact@v4
        with:
          name: placeholder
          path: index.html  # any small file to prevent error (gets overridden anyway)

      # Upload Pages artifact properly
      - name: Upload static site to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'  # adjust if index.html is in a subfolder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
